<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IRONTRAP</title><style>html,body{margin:0;background:#080b0f;color:#e8edf3;font-family:monospace;height:100%}body{display:grid;place-items:center}.msg{letter-spacing:.22em;font-weight:700;text-align:center;padding:24px}</style></head><body><div class="msg" id="m">IRONTRAP — LOADING</div><script>(async()=>{try{const m=document.getElementById('m'),files=[];for(let i=1;i<=12;i++)files.push('src/parts/part'+String(i).padStart(2,'0')+'.txt');files.push('src/parts/part13a.txt','src/parts/part13b.txt');let s='';for(let i=0;i<files.length;i++){m.textContent='IRONTRAP — LOADING '+(i+1)+'/'+files.length;const r=await fetch(files[i],{cache:'no-store'});if(!r.ok)throw new Error(files[i]+' HTTP '+r.status);s+=(await r.text()).trim()}const bin=Uint8Array.from(atob(s),c=>c.charCodeAt(0)),ds=new DecompressionStream('gzip');let html=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();html=html.replace('</head>','<link rel="stylesheet" href="/r82-patch.css?v=82"></head>');const tag='<scr'+'ipt src="/r82-patch.js?v=82"></scr'+'ipt>';html=html.replace('</body>',tag+'</body>');document.open();document.write(html);document.close()}catch(e){document.getElementById('m').textContent='IRONTRAP LOAD ERROR — '+e.message;console.error(e)}})();</script></body></html>
