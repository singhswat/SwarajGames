<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IRONTRAP</title><style>html,body{margin:0;background:#050708;color:#fff;font-family:system-ui;height:100%}body{display:grid;place-items:center}#s{opacity:.75}</style></head><body><div id="s">Loading IRONTRAP…</div><script>(async()=>{try{const files=['/src/irontrap-r8.1.html.gz.part001','/src/irontrap-r8.1.html.gz.part002','/src/irontrap-r8.1.html.gz.part003'];const parts=await Promise.all(files.map(async f=>new Uint8Array(await(await fetch(f,{cache:'no-store'})).arrayBuffer())));const n=parts.reduce((a,p)=>a+p.length,0),all=new Uint8Array(n);let o=0;for(const p of parts){all.set(p,o);o+=p.length}const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([all]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('s').textContent='IRONTRAP failed to load: '+e.message;console.error(e)}})();</script></body></html>
