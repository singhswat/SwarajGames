<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IRONTRAP</title>
<!-- deployment target: GitHub main -> connected host -->
<style>html,body{margin:0;background:#080b0f;color:#e8edf3;font-family:monospace;height:100%}body{display:grid;place-items:center}.msg{letter-spacing:.22em;font-weight:700;text-align:center;padding:24px}</style>
</head><body><div class="msg" id="m">IRONTRAP - LOADING</div>
<script>
(async () => {
  try {
    const message = document.getElementById('m');
    const files = [];
    for (let i = 1; i <= 12; i++) files.push('src/parts/part' + String(i).padStart(2, '0') + '.txt');
    files.push('src/parts/part13a.txt', 'src/parts/part13b.txt');
    let packed = '';
    for (let i = 0; i < files.length; i++) {
      message.textContent = 'IRONTRAP - LOADING ' + (i + 1) + '/' + files.length;
      const response = await fetch(files[i], { cache: 'no-store' });
      if (!response.ok) throw new Error(files[i] + ' HTTP ' + response.status);
      packed += (await response.text()).trim();
    }
    const bin = Uint8Array.from(atob(packed), c => c.charCodeAt(0));
    let html = await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    const gameplay = [];
    for (const file of ['r105-random-loot.js?v=108', 'r106-ambushes.js?v=110', 'r107-encounters.js?v=110', 'r110-minigames.js?v=110']) {
      const response = await fetch(file, { cache: 'no-store' });
      if (!response.ok) throw new Error(file + ' HTTP ' + response.status);
      gameplay.push(await response.text());
    }
    const lock1 = `  if (d.isBoss && (G.time - (G.bossEngagedAt === null ? G.time : G.bossEngagedAt)) < 180 * 60 && !save.cheats.gunOne && !save.cheats.saberOne && e.hp <= 0) {\n    e.hp = 1;\n    if (frame % 60 === 0) popText(e.x + e.w / 2, e.y - 18, "FINAL PHASE LOCKED", "#f2c14e");\n  }\n`;
    const lock2 = `function keepBossInEndurancePhase(e, d) {\n  if (!d.isBoss || save.cheats.gunOne || save.cheats.saberOne) return false;\n  if (G.bossEngagedAt === null) G.bossEngagedAt = G.time;\n  if (G.time - G.bossEngagedAt < 180 * 60 && e.hp <= 0) { e.hp = 1; return true; }\n  return false;\n}`;
    html = html.replace(lock1, '').replace(lock2, 'function keepBossInEndurancePhase(e, d) { return false; }');
    html = html.replace('const gold = mulberry(num * 977 + x * 31 + y)() < 0.10;', 'const gold = Math.random() < 0.10;');
    const scriptTag = source => '<scr' + 'ipt src="' + source + '"></scr' + 'ipt>';
    const css = ['r82-patch.css?v=82', 'r83-patch.css?v=83', 'r84-patch.css?v=84', 'r85-credits.css?v=85', 'r87-systems.css?v=87', 'r91-home.css?v=91', 'r93-comets.css?v=97'];
    html = html.replace('</head>', scriptTag('r85-pre.js?v=85') + css.map(file => '<link rel="stylesheet" href="' + file + '">').join('') + '</head>');
    const legacy = ['r82-patch.js?v=82', 'r83-patch.js?v=83', 'r84-patch.js?v=84', 'r85-credits.js?v=85', 'r86-boss-death.js?v=86', 'r87-systems.js?v=87', 'r88-hitfx.js?v=88', 'r89-achievements.js?v=89', 'r90-finale-summary.js?v=90', 'r91-home.js?v=91', 'r93-comets.js?v=97', 'r98-boss-balance.js?v=103', 'r101-latest.js?v=101', 'r104-credits.js?v=104'];
    const gameplayTags = gameplay.map(code => '<scr' + 'ipt>' + code + '</scr' + 'ipt>').join('');
    // Preserve the existing legacy load condition, including exports without a body closer.
    html = html.includes('</body>') ? html.replace('</body>', legacy.map(scriptTag).join('') + gameplayTags + '</body>') : html + gameplayTags + '</body></html>';
    document.open();
    document.write(html);
    document.close();
  } catch (error) {
    const message = document.getElementById('m');
    if (message) message.textContent = 'IRONTRAP LOAD ERROR - ' + error.message;
    console.error(error);
  }
})();
</script></body></html>
