<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IRONTRAP</title><style>html,body{margin:0;background:#080b0f;color:#e8edf3;font-family:monospace;height:100%}body{display:grid;place-items:center}.msg{letter-spacing:.28em;font-weight:700;text-align:center;padding:24px}</style></head><body><div class="msg" id="m">IRONTRAP — LOADING</div><script>
(async()=>{try{const N=13;let s='';for(let i=1;i<=N;i++){const f='src/parts/part'+String(i).padStart(2,'0')+'.txt';const r=await fetch(f,{cache:'no-store'});if(!r.ok)throw new Error(f+' HTTP '+r.status);s+=(await r.text()).trim();}const bin=Uint8Array.from(atob(s),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close();}catch(e){document.getElementById('m').textContent='IRONTRAP LOAD ERROR — '+e.message;console.error(e);}})();
</script></body></html>
