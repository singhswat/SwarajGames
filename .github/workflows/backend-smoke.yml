name: IRONTRAP Vercel smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vercel:
    runs-on: ubuntu-latest
    steps:
      - name: Check live IRONTRAP site
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://irontrap.vercel.app'
          for path in '/' '/r93-comets.js?v=97' '/r93-comets.css?v=97'; do
            code=$(curl --retry 5 --retry-delay 2 -LsS -o /tmp/out -w '%{http_code}' "$BASE$path")
            echo "$path -> HTTP $code"
            test "$code" = "200"
          done

      - name: Verify comet build is referenced by production loader
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-delay 2 -LsS 'https://irontrap.vercel.app/' -o /tmp/index.html
          grep -q 'r93-comets.css?v=97' /tmp/index.html
          grep -q 'r93-comets.js?v=97' /tmp/index.html
          echo 'R97 comet assets are referenced by the live Vercel loader.'
